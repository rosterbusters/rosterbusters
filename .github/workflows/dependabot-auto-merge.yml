name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, labeled, synchronize]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            // Get PR from event payload or fetch it for check_suite/workflow_run events
            let pr = context.payload.pull_request;

            if (!pr && (context.eventName === 'check_suite' || context.eventName === 'workflow_run')) {
              // For check_suite/workflow_run, find associated PRs
              const head_sha = context.payload.check_suite?.head_sha || context.payload.workflow_run?.head_sha;
              if (!head_sha) {
                console.log('No head_sha found');
                return;
              }

              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:dependabot`
              });

              pr = prs.data.find(p => p.head.sha === head_sha);
              if (!pr) {
                console.log('No matching Dependabot PR found');
                return;
              }
            }

            if (!pr) {
              console.log('No PR found');
              return;
            }

            // Only run for Dependabot PRs targeting main
            if (pr.user.login !== 'dependabot[bot]' || pr.base.ref !== 'main') {
              console.log('Not a Dependabot PR targeting main');
              return;
            }

            // Check GitHub Actions check runs (modern CI)
            const checkRuns = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });

            const allChecksPassed = checkRuns.data.check_runs.length > 0 &&
              checkRuns.data.check_runs.every(run =>
                run.status === 'completed' && run.conclusion === 'success'
              );

            // Also check traditional status checks
            const status = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });

            const statusPassed = status.data.state === 'success' || status.data.statuses.length === 0;

            console.log(`Check runs: ${checkRuns.data.check_runs.length}, all passed: ${allChecksPassed}`);
            console.log(`Status checks state: ${status.data.state}`);

            if (allChecksPassed && statusPassed) {
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'squash'
                });
                console.log(`PR #${pr.number} merged!`);
              } catch (e) {
                console.log(`Failed to merge PR #${pr.number}: ${e.message}`);
              }
            } else {
              console.log(`PR #${pr.number} cannot be merged: checks not passing`);
            }
