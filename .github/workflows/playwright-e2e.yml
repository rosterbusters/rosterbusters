name: Playwright E2E

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare backend env
        working-directory: .
        run: cp .env.e2e .env

      - name: Create dummy Google OAuth credentials
        working-directory: .
        run: echo '{}' > backend/google_oauth_credentials.json

      - name: Create docker network
        working-directory: .
        run: docker network create traefik-public || true

      - name: Start backend stack
        working-directory: .
        run: docker compose up -d db backend mailcatcher

      - name: Wait for backend
        working-directory: .
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8000/api/v1/utils/health-check/ && exit 0
            sleep 2
          done
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: true
          MAILCATCHER_HOST: http://127.0.0.1:1080
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose down -v --remove-orphans
