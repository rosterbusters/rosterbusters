name: Lint Backend

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync
        working-directory: backend
      - name: Auto-fix lint issues
        run: uv run ruff check app --fix
        working-directory: backend
      - name: Auto-format code
        run: uv run ruff format app
        working-directory: backend
      - name: Run lint
        run: uv run bash scripts/lint.sh
        working-directory: backend
