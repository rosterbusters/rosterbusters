name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST_PROD }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy credentials to EC2
        run: |
          echo '${{ secrets.GOOGLEOAUTHCREDENTIALS }}' | ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_PROD }} "mkdir -p ~/rosterbusters/backend && cat > ~/rosterbusters/backend/google_oauth_credentials.json"

      - name: Sync code to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_PROD }} << EOF
          set -e
          mkdir -p ~/rosterbusters
          cd ~/rosterbusters
          if [ ! -d .git ]; then
            git init
            git remote add origin https://github.com/rosterbusters/rosterbusters.git
          fi
          git remote set-url origin https://oauth2:${{ secrets.GH_PAT }}@github.com/rosterbusters/rosterbusters.git
          git fetch origin
          git reset --hard origin/production
          git remote set-url origin https://github.com/rosterbusters/rosterbusters.git
          EOF

      - name: Create .env file on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_PROD }} "cat > ~/rosterbusters/.env" << 'EOF'
          ENVIRONMENT=production
          PROJECT_NAME=RosterBusters
          FRONTEND_HOST=https://${{ secrets.DOMAIN_PROD }}
          DOMAIN=${{ secrets.DOMAIN_PROD }}
          STACK_NAME=${{ secrets.STACK_NAME_PROD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          POSTGRES_SERVER=${{ secrets.RDS_PROD_HOST }}
          POSTGRES_USER=${{ secrets.RDS_PROD_USER }}
          POSTGRES_PASSWORD=${{ secrets.RDS_PROD_PASSWORD }}
          POSTGRES_DB=${{ secrets.RDS_PROD_DB }}
          POSTGRES_PORT=5432
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_OAUTH_ALLOWED_DOMAINS=${{ secrets.GOOGLE_OAUTH_ALLOWED_DOMAINS }}
          USERS_OPEN_REGISTRATION=True
          FIRST_SUPERUSER=${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD=${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          EMAILS_FROM_EMAIL=${{ secrets.EMAILS_FROM_EMAIL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          GOOGLE_APPLICATION_CREDENTIALS=backend/google_oauth_credentials.json
          DOCKER_IMAGE_BACKEND=backend
          DOCKER_IMAGE_FRONTEND=frontend
          BACKEND_CORS_ORIGINS=["https://${{ secrets.DOMAIN_PROD }}","https://www.${{ secrets.DOMAIN_PROD }}"]
          ACCESS_TOKEN_EXPIRE_MINUTES=10080
          ALGORITHM=HS256
          EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          USERNAME=${{ secrets.TRAEFIK_USERNAME }}
          HASHED_PASSWORD=${{ secrets.TRAEFIK_HASHED_PASSWORD }}
          GRB_WLSACCESSID=${{ secrets.GRB_WLSACCESSID }}
          GRB_WLSSECRET=${{ secrets.GRB_WLSSECRET }}
          GRB_LICENSEID=${{ secrets.GRB_LICENSEID }}
          EOF

      - name: Strip whitespace from .env
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_PROD }} "sed -i 's/^[[:space:]]*//' ~/rosterbusters/.env"

      - name: Build & run Docker on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_PROD }} << 'EOF'
          set -e
          cd ~/rosterbusters

          docker stop $(docker ps -q) 2>/dev/null || true
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v --remove-orphans 2>/dev/null || true
          docker compose -f docker-compose.traefik.yml down --remove-orphans 2>/dev/null || true

          docker image prune -a -f
          docker builder prune -a -f

          docker network create traefik-public 2>/dev/null || true

          docker compose -f docker-compose.traefik.yml up -d

          DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 \
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build

          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans || {
            echo "=== PRESTART LOGS ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs prestart
            exit 1
          }

          EOF
