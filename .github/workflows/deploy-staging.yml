name: Deploy to Staging

on:
  push:
    branches:
      - rds-integrate

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'bash -s' << 'ENDSSH'
          set -e
          
          # Navigate to project directory
          cd ~/rosterbusters || (mkdir -p ~/rosterbusters && cd ~/rosterbusters)
          
          # Initialize git if needed
          if [ ! -d .git ]; then
            git init
            git remote add origin https://github.com/vanhthefirst/rosterbusters.git
          fi
          
          # Fetch and reset to latest rds-integrate branch
          git fetch origin rds-integrate
          git reset --hard origin/rds-integrate
          
          # Create necessary directories
          mkdir -p backend certs
          
          # Download RDS certificate
          curl -o certs/global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          
          # Create .env file
          cat > .env << 'ENVEOF'
          ENVIRONMENT=staging
          DOMAIN=${{ secrets.DOMAIN_STAGING }}
          STACK_NAME=${{ secrets.STACK_NAME_STAGING }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_OAUTH_ALLOWED_DOMAINS=${{ secrets.GOOGLE_OAUTH_ALLOWED_DOMAINS }}
          USERS_OPEN_REGISTRATION=True
          FIRST_SUPERUSER=${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD=${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          EMAILS_FROM_EMAIL=${{ secrets.EMAILS_FROM_EMAIL }}
          POSTGRES_SERVER=${{ secrets.RDS_HOST }}
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=postgres
          POSTGRES_SSL_MODE=verify-full
          POSTGRES_SSL_CERT=/app/certs/global-bundle.pem
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          GOOGLE_APPLICATION_CREDENTIALS=backend/google_oauth_credentials.json
          ENVEOF
          
          # Create google_oauth_credentials.json
          cat > backend/google_oauth_credentials.json << 'GOOGLEEOF'
          ${{ secrets.GOOGLEOAUTHCREDENTIALS }}
          GOOGLEEOF
          
          # Stop existing containers
          docker compose down
          
          # Build and start containers
          docker compose up -d --build
          
          # Show container status
          docker compose ps
          ENDSSH