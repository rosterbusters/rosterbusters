name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 10
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy credentials to EC2
        run: |
          echo '${{ secrets.GOOGLEOAUTHCREDENTIALS }}' | ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/rosterbusters/backend && cat > ~/rosterbusters/backend/google_oauth_credentials.json"

      - name: Sync code to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
          set -e
          mkdir -p ~/rosterbusters
          cd ~/rosterbusters
          if [ ! -d .git ]; then
            git init
            git remote add origin https://github.com/rosterbusters/rosterbusters.git
          fi
          git remote set-url origin https://oauth2:${{ secrets.GH_PAT }}@github.com/rosterbusters/rosterbusters.git
          git fetch origin
          git reset --hard origin/main
          git remote set-url origin https://github.com/rosterbusters/rosterbusters.git
          EOF

      - name: Create .env file on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "cat > ~/rosterbusters/.env" << 'EOF'
          ENVIRONMENT=staging
          PROJECT_NAME=SACH Duby
          FRONTEND_HOST=https://dashboard.${{ secrets.DOMAIN_STAGING }}
          FIRST_LOGIN_SETUP_HOST=https://dashboard.${{ secrets.DOMAIN_STAGING }}
          DOMAIN=${{ secrets.DOMAIN_STAGING }}
          STACK_NAME=${{ secrets.STACK_NAME_STAGING }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          POSTGRES_SERVER=db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=app
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_OAUTH_ALLOWED_DOMAINS=${{ secrets.GOOGLE_OAUTH_ALLOWED_DOMAINS }}
          USERS_OPEN_REGISTRATION=True
          FIRST_SUPERUSER=${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD=${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_SES_SENDER_EMAIL=${{ secrets.AWS_SES_SENDER_EMAIL }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          EMAILS_FROM_EMAIL=${{ secrets.EMAILS_FROM_EMAIL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          GOOGLE_APPLICATION_CREDENTIALS=backend/google_oauth_credentials.json
          DOCKER_IMAGE_BACKEND=backend
          DOCKER_IMAGE_FRONTEND=frontend
          BACKEND_CORS_ORIGINS=["https://dashboard.${{ secrets.DOMAIN_STAGING }}"]
          ACCESS_TOKEN_EXPIRE_MINUTES=10080
          ALGORITHM=HS256
          POSTGRES_PORT=5432
          EMAIL=${{ secrets.LETSENCRYPT_EMAIL }}
          USERNAME=${{ secrets.TRAEFIK_USERNAME }}
          HASHED_PASSWORD=${{ secrets.TRAEFIK_HASHED_PASSWORD }}
          GRB_WLSACCESSID=${{ secrets.GRB_WLSACCESSID }}
          GRB_WLSSECRET=${{ secrets.GRB_WLSSECRET }}
          GRB_LICENSEID=${{ secrets.GRB_LICENSEID }}
          EOF

      - name: Strip whitespace from .env
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sed -i 's/^[[:space:]]*//' ~/rosterbusters/.env"

      - name: Build & run Docker on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "export DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'; export DOCKERHUB_TOKEN='${{ secrets.DOCKERHUB_TOKEN }}'; bash -s" << 'EOF'
          set -e
          cd ~/rosterbusters

          # Authenticate before pulling base images to avoid Docker Hub
          # unauthenticated rate limits during remote builds.
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

          # Stop all containers including Traefik and any orphans
          docker compose -f docker-compose.yml -f docker-compose.staging.yml down -v --remove-orphans 2>/dev/null || true
          docker compose -f docker-compose.traefik.yml -f docker-compose.traefik.staging.yml down --remove-orphans 2>/dev/null || true

          # Clean up unused images and build cache to free disk space
          docker image prune -a -f
          docker builder prune -a -f

          # Create the external network for Traefik (idempotent)
          docker network create traefik-public 2>/dev/null || true

          # Start Traefik reverse proxy (handles SSL via Let's Encrypt)
          docker compose -f docker-compose.traefik.yml -f docker-compose.traefik.staging.yml up -d

          # Build and start the app in production mode
          DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 \
          docker compose -f docker-compose.yml -f docker-compose.staging.yml build
          docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d

          EOF
      
