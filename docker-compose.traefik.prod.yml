services:
  traefik:
    volumes:
      # Serve a Cloudflare Origin CA certificate to the proxied edge in production.
      - /home/ubuntu/rosterbusters/traefik/certs:/certs:ro
      - /home/ubuntu/rosterbusters/traefik/dynamic:/dynamic:ro
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --accesslog
      - --log
      - --api
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
