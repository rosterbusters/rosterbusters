services:
  db:
    profiles: ["local-db"]  # opt-in only; prod normally uses the external Postgres host
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
  adminer:
    profiles: ["local-db"]  # opt-in only alongside the local db service
    restart: unless-stopped
  prestart:
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER}

  backend:
    command: ["fastapi", "run", "--workers", "4", "app/main.py"]
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - REDIS_URL=redis://redis:6379/0

  celery_worker:
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - GRB_WLSACCESSID=${GRB_WLSACCESSID}
      - GRB_WLSSECRET=${GRB_WLSSECRET}
      - GRB_LICENSEID=${GRB_LICENSEID}
    volumes:
      - ~/gurobi.lic:/root/gurobi.lic:ro

  frontend:
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        - NODE_ENV=production
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.constraint-label: traefik-public
      traefik.http.services.frontend.loadbalancer.server.port: "80"
      traefik.http.routers.frontend-http.rule: Host(`${DOMAIN?Variable not set}`) || Host(`www.${DOMAIN?Variable not set}`) || Host(`dashboard.${DOMAIN?Variable not set}`)
      traefik.http.routers.frontend-http.entrypoints: http
      traefik.http.routers.frontend-http.middlewares: https-redirect
      traefik.http.routers.frontend-https.rule: Host(`${DOMAIN?Variable not set}`) || Host(`www.${DOMAIN?Variable not set}`) || Host(`dashboard.${DOMAIN?Variable not set}`)
      traefik.http.routers.frontend-https.entrypoints: https
      traefik.http.routers.frontend-https.tls: "true"

networks:
  traefik-public:
    external: true
