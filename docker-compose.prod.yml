services:
  proxy:
    image: traefik:3.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/certificates
    command:
      - --providers.docker
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --certificatesresolvers.le.acme.email=${EMAIL?Variable not set}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --accesslog
      - --log
      - --api
    labels:
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
    networks:
      - traefik-public
      - default

  db:
    profiles: []  # override prod, re-enable db for staging
    restart: unless-stopped
  adminer:
    profiles: []  # ensure adminer can find db
    restart: unless-stopped
  prestart:
    depends_on: {}
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER}

  backend:
    depends_on:
      prestart:
        condition: service_completed_successfully
    volumes: []
    command: ["fastapi", "run", "--workers", "4", "app/main.py"]
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - REDIS_URL=redis://redis:6379/0

  celery_worker:
    environment:
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - GRB_WLSACCESSID=${WLSACCESSID}
      - GRB_WLSSECRET=${WLSSECRET}
      - GRB_LICENSEID=${LICENSEID}
    volumes:
      - ~/gurobi.lic:/root/gurobi.lic:ro

  frontend:
    ports: []
    volumes: []
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.${DOMAIN?Variable not set}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`${DOMAIN?Variable not set}`) || Host(`www.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`${DOMAIN?Variable not set}`) || Host(`www.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect

volumes:
  traefik-certificates:

networks:
  traefik-public:
    external: false